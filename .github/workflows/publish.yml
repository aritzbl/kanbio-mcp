# Publishes @kanbio/mcp to npm when a v* tag is pushed, with npm trusted
# publishing (OIDC): no npm token or secret, and npm adds provenance.
# Requires the trusted publisher on npmjs.com: repository axen-arg/kanbio-mcp,
# workflow publish.yml.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Install npm 11.21.0
        run: npm install -g npm@11.21.0

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --access public
